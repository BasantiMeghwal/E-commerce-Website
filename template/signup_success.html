<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | ShopEasy</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:420px;
            background:#fff;
            padding:40px;
            text-align:center;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.12);
        }

        .icon{
            width:90px;
            height:90px;
            margin:0 auto 20px;
            background:#28a745;
            color:#fff;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
        }

        h1{
            color:#222;
            margin-bottom:15px;
        }

        p{
            color:#666;
            line-height:1.7;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            background:#007bff;
            color:#fff;
            text-decoration:none;
            padding:12px 28px;
            border-radius:8px;
            transition:.3s;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>Success!</h1>

    <p>
        Your request has been completed successfully.
        Thank you for choosing <strong>ShopEasy</strong>.
    </p>

    <a href="/" class="btn">Back to Home</a>

</div>

</body>
</html>
