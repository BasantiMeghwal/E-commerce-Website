<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - ShopEasy</title>
    <style>body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.container {
    width: 400px;
    margin: 120px auto;
    background: white;
    padding: 40px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.container h1 {
    color: green;
    font-size: 32px;
}

.container p {
    color: #555;
    font-size: 18px;
    margin: 10px 0;
}

.container button {
    margin-top: 20px;
    padding: 12px 25px;
    background: #ff6600;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.container button:hover {
    background: #e65c00;
}

.container a {
    text-decoration: none;
}</style>
</head>

<body>

    <div class="container">
        <h1>✅ Thank You!</h1>
        <p>Your message has been sent successfully.</p>
        <p>We will contact you soon.</p>

        <a href="/">
            <button>Back to Home</button>
        </a>
    </div>

</body>
</html>
